<header><div><div class="eyebrow">YOUR UK HOME & TRAVEL ATLAS</div><h1>倫敦住處 × 英國旅行地圖</h1><p>整套獨住 · 月租 £1,000–2,000 · 不開車 · 十二月至五月</p></div><div class="header-actions"><button class="button" id="guideBtn">怎麼看這張圖</button><button class="button dark" id="compareBtn">★ 收藏比較 <span id="favCount">0</span></button></div></header>
<div class="layout"><aside><div class="filters"><input id="search" class="search" placeholder="搜尋地區、小鎮、地鐵線…" aria-label="搜尋地點"><div class="chips" id="chips"></div><div class="filter-extra"><label><input type="checkbox" id="onlyFav"> 只看收藏</label><span id="count"></span></div></div><div class="list" id="list"></div><div class="footer-note">推薦是依妳的生活與旅行需求；「非優先」不等於治安差；！標記有選房／晚歸提醒。點地點查看備註與警方來源，再查完整地址與門禁。</div></aside>
<main><div class="toolbar"><div class="tabs" role="tablist"><button class="tab active" id="tubeTab" role="tab" aria-selected="true">倫敦地鐵圖</button><button class="tab" id="geoTab" role="tab" aria-selected="false">英國旅行方位</button></div><div class="map-tools"><button class="tool" id="minus" aria-label="縮小">−</button><button class="tool" id="plus" aria-label="放大">＋</button><button class="tool wide" id="fit">全圖</button><button class="tool wide" id="focusMap" aria-pressed="false">專注地圖</button><button class="tool wide" id="labels" aria-pressed="false">地名</button><button class="tool wide" id="fullscreen">全螢幕</button></div></div>
<div class="legend"><span><i class="dot" style="--c:var(--first)"></i>優先找房</span><span><i class="dot" style="--c:var(--consider)"></i>條件式考慮</span><span><i class="dot" style="--c:var(--caution)"></i>找房非優先</span><span><i class="dot" style="--c:var(--trip)"></i>旅行／短住</span><span><i class="dot" style="--c:var(--gateway)"></i>接車站／機場</span><span style="color:#94402e;font-weight:750">！需謹慎選房／晚歸</span></div>
<div class="viewport" id="viewport" tabindex="0" aria-label="互動地圖；拖曳移動，使用加減按鈕縮放"><div class="plane" id="plane"><img class="map-img" id="mapImage" src="__MAP__" alt="使用者提供的 TfL 地鐵圖，2026 年 9 月版本"><svg id="geoMap" viewBox="0 0 1100 850" style="display:none;width:100%;height:100%" aria-label="英國城市與旅行地點的地理方位示意"><rect width="1100" height="850" fill="#f0f2e9"/><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="#dbe1d3" stroke-width="1"/></pattern></defs><rect width="1100" height="850" fill="url(#grid)"/><path d="M 330 110 Q 560 180 420 340 Q 560 430 380 590 Q 440 730 900 740" fill="none" stroke="#e2e8db" stroke-width="150" stroke-linecap="round"/><text x="35" y="45" font-size="24" font-weight="700" fill="#173b36">英國旅行方位</text><text x="35" y="70" class="geo-label">位置近似 · 地理方位示意 · 非地鐵圖或鐵路路線圖</text><text x="550" y="155" class="geo-label">英格蘭北部</text><text x="510" y="370" class="geo-label">英格蘭中部</text><text x="220" y="610" class="geo-label">西部與科茲窩</text><text x="770" y="610" class="geo-label">倫敦與東南部</text><text x="520" y="810" class="geo-label">南岸</text><text x="1050" y="60" font-size="22" fill="#397969">↑ N</text><circle id="londonHalo" cx="640" cy="650" r="28" fill="#c6dacc" opacity=".5"/></svg><div class="pins" id="pins"></div></div><button class="offmap" id="offmap">圖外目的地 →</button><div class="map-note" id="mapNote">拖曳移動 · 滾輪縮放 · 點標記看原因。地鐵圖是路線示意，不能拿線段長度估步行距離。</div><section class="details" id="details" aria-live="polite" aria-label="地點說明" hidden></section></div></main></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-content"><div class="modal-head"><h2 id="modalTitle"></h2><button class="button" id="closeModal">關閉 ✕</button></div><div id="modalBody"></div></div></div><div class="flash" id="flash" role="status"></div>
<script>
const DATA=__DATA__;
const TYPES={first:['優先找房','#157b59'],consider:['條件式考慮','#c0882b'],caution:['找房非優先','#bb5c48'],trip:['旅行／短住','#7560b8'],gateway:['接車站／機場','#3475b8']};
const $=id=>document.getElementById(id);let favorites=[];try{favorites=JSON.parse(localStorage.getItem('uk-travel-favorites')||'[]')}catch{};let popupOpen=false,lastDragTime=-1000;let selected='ealing',filter='all',view='tube',showLabels=false,scale=1,tx=0,ty=0,pw=1190.55,ph=724,modalLast=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filtered(){const q=$('search').value.trim().toLowerCase();return DATA.filter(p=>(filter==='all'||(filter==='safety'?p.safetyFlag:p.kind===filter))&&(!$('onlyFav').checked||favorites.includes(p.id))&&(!q||[p.name,p.zh,p.area,p.reason,p.life,p.travel,p.safety,...p.tags].join(' ').toLowerCase().includes(q)))}
function num(p){return DATA.indexOf(p)+1}function isFav(id){return favorites.includes(id)}
function chips(){ $('chips').innerHTML=[['all','全部'],...Object.entries(TYPES).map(([k,v])=>[k,v[0]]),['safety','！需謹慎的位置']].map(([k,v])=>`<button class="chip ${filter===k?'active':''}" data-filter="${k}" aria-pressed="${filter===k}">${v}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;chips();render()})}
function render(){const data=filtered();if(data.length&&!data.some(p=>p.id===selected))selected=data[0].id;$('count').textContent=`${data.length} 個地點`;$('favCount').textContent=favorites.length;const on=data.filter(p=>view==='tube'?p.tube:p.geo).length;$('list').innerHTML=`<div class="listmeta">${view==='tube'?'地鐵圖':'地理方位圖'}顯示 ${on} 個 · ${data.length-on} 個在圖外<br>★ 收藏後可並排比較；點卡片自動定位。</div>`+data.map(p=>`<article class="place-card ${p.id===selected?'selected':''}" style="--c:${TYPES[p.kind][1]}" data-id="${p.id}" tabindex="0" role="button" aria-label="查看 ${esc(p.name)}"><button class="fav ${isFav(p.id)?'on':''}" data-fav="${p.id}" aria-label="${isFav(p.id)?'移除收藏':'收藏'} ${esc(p.name)}">${isFav(p.id)?'★':'☆'}</button><div class="cardtop"><span class="number">${num(p)}</span><div><h3>${esc(p.name)}</h3><small>${esc(p.zh)} · ${esc(p.area)}</small><br><span class="cardbadge">${TYPES[p.kind][0]}${view==='tube'&&!p.tube?' · 圖外':''}</span></div></div><p>${esc(p.reason)}</p>${p.safetyFlag?'<span class="safety-badge">！治安／晚歸提醒</span>':''}</article>`).join('')+(data.length?'':'<p class="empty">沒有符合的地點。試著清除搜尋或切換分類。</p>');$('list').querySelectorAll('.place-card').forEach(c=>{c.onclick=()=>select(c.dataset.id,true);c.onkeydown=e=>{if(e.target===c&&['Enter',' '].includes(e.key)){e.preventDefault();select(c.dataset.id,true)}}});$('list').querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav)});renderPins();renderDetail();applyTransform()}
function coords(p){if(view==='tube')return p.tube?{x:p.tube[0]/100*pw,y:p.tube[1]/100*907.588-60}:null;if(!p.geo)return null;return{x:95+(p.geo[0]+2.8)/4.65*930,y:110+(53.65-p.geo[1])/3.12*660}}
function renderPins(){const data=filtered().filter(p=>coords(p));$('pins').classList.toggle('show-labels',showLabels);$('pins').innerHTML=data.map(p=>{const c=coords(p);return`<button class="pin ${p.kind==='gateway'?'gateway':''} ${p.id===selected?'selected':''}" style="left:${c.x}px;top:${c.y}px;--c:${TYPES[p.kind][1]}" data-id="${p.id}" aria-label="${esc(p.name)}，${TYPES[p.kind][0]}${p.safetyFlag?'，需謹慎選房或晚歸':''}" title="${esc(p.name)} · ${TYPES[p.kind][0]}${p.safetyFlag?' · 需謹慎選房／晚歸':''}">${num(p)}${p.safetyFlag?'<span class="safety-alert" aria-hidden="true">!</span>':''}<span class="pin-label">${esc(p.name)}</span></button>`}).join('');$('pins').querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();select(b.dataset.id,false)});$('offmap').style.display=view==='tube'?'block':'none';$('mapNote').textContent=view==='tube'?'拖曳移動 · 滾輪縮放 · 點標記看原因。區域以代表車站定位，地鐵線段長度不代表步行距離。':'地點依近似經緯度定位；沒有畫鐵路連線。倫敦標記集中，可放大或切回地鐵圖。';if(view==='geo'){const london=coords({geo:[-.127,51.507]});$('londonHalo').setAttribute('cx',london.x);$('londonHalo').setAttribute('cy',london.y)}}
function safetyHTML(p){if(!p.safety)return '';return `<section class="safety-notes ${p.safetyFlag?'attention':''}"><h4>${p.safetyFlag?'！ ':''}治安與晚歸備註</h4><p>${esc(p.safety)}</p><div class="safety-links">${(p.safetySources||[]).map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)} ↗</a>`).join('')}</div><small>整理：${esc(p.safetyUpdated)} · 依警方資料與妳的需求篩選，不是整區危險排名。完整郵遞區號、門禁與夜間回家路線仍須確認。</small></section>`}
function renderDetail(){$('details').hidden=!popupOpen;const p=DATA.find(p=>p.id===selected);if(!p)return;const type=TYPES[p.kind];$('details').innerHTML=`<div class="detail-head"><div><h2>${esc(p.name)}</h2><div class="subtitle"><span style="color:${type[1]};font-weight:750">${type[0]}</span> · ${esc(p.zh)} · ${esc(p.area)}</div></div><div class="detail-actions"><button class="button" id="detailFav">${isFav(p.id)?'★ 已收藏':'☆ 收藏比較'}</button><button class="detail-close" id="closeDetail" aria-label="關閉地點說明">✕</button></div></div><p class="detail-reason">${esc(p.reason)}</p><div class="detail-grid">${p.life!==p.safety?`<div><h4>居住／停留怎麼選</h4><p>${esc(p.life)}</p></div>`:''}<div><h4>旅行與接車方式</h4><p>${esc(p.travel)}</p></div></div>${safetyHTML(p)}${p.budget?`<div class="budget">${esc(p.budget)}</div>`:''}<div class="detail-bottom">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<a class="source" target="_blank" rel="noopener noreferrer" href="${esc(p.source)}">${p.tags.includes('書中推薦')?'推薦來源／書籍目錄':'查詢房源或官方交通'} ↗</a></div>`;$('detailFav').onclick=()=>toggleFav(p.id);$('closeDetail').onclick=()=>{closeDetail();$('viewport').focus({preventScroll:true})}}
function closeDetail(){popupOpen=false;$('details').hidden=true}
function select(id,focus){popupOpen=true;selected=id;const p=DATA.find(p=>p.id===id);if(view==='tube'&&!p.tube){setView('geo',false);flash('這個目的地不在地鐵圖內，已切換地理方位。')}render();if(focus)focusPlace(p)}
function toggleFav(id){favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];try{localStorage.setItem('uk-travel-favorites',JSON.stringify(favorites))}catch{}render();if(!$('modal').hidden&&$('modalTitle').textContent==='收藏比較')showComparison()}
function applyTransform(){ $('plane').style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; $('pins').querySelectorAll('.pin').forEach(b=>b.style.transform=`translate(-50%,-50%) scale(${1/scale})`)}
function fit(){const r=$('viewport').getBoundingClientRect();scale=Math.min(r.width/pw,r.height/ph)*.96;tx=(r.width-pw*scale)/2;ty=(r.height-ph*scale)/2;applyTransform()}
function zoom(f,x,y){const r=$('viewport').getBoundingClientRect();x=x??r.width/2;y=y??r.height/2;const min=Math.min(r.width/pw,r.height/ph)*.35;const next=Math.max(min,Math.min(6,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;applyTransform()}
function focusPlace(p){const c=coords(p);if(!c)return;const r=$('viewport').getBoundingClientRect();scale=Math.max(scale,view==='tube'?1.35:1.8);tx=r.width/2-c.x*scale;ty=r.height/2-c.y*scale;applyTransform()}
function setView(v,reset=true){view=v;pw=v==='tube'?1190.55:1100;ph=v==='tube'?724:850;$('plane').style.width=pw+'px';$('plane').style.height=ph+'px';$('mapImage').style.display=v==='tube'?'block':'none';$('geoMap').style.display=v==='geo'?'block':'none';$('tubeTab').classList.toggle('active',v==='tube');$('geoTab').classList.toggle('active',v==='geo');$('tubeTab').setAttribute('aria-selected',v==='tube');$('geoTab').setAttribute('aria-selected',v==='geo');render();if(reset)fit()}
function flash(t){$('flash').textContent=t;$('flash').style.display='block';setTimeout(()=>$('flash').style.display='none',2600)}
function openModal(title,html){modalLast=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').hidden=false;$('closeModal').focus()}
function showComparison(){const ps=DATA.filter(p=>isFav(p.id));openModal('收藏比較',ps.length?`<p style="color:var(--muted);font-size:12px">收藏存於這個瀏覽器。可用瀏覽器列印保存比較。</p><div class="compare-grid">${ps.map(p=>`<article class="compare-item"><span class="cardbadge" style="--c:${TYPES[p.kind][1]}">${TYPES[p.kind][0]}</span><h3>${esc(p.name)}</h3><small>${esc(p.zh)}</small><p>${esc(p.reason)}</p>${p.life!==p.safety?`<h4>日常生活／停留</h4><p>${esc(p.life)}</p>`:''}<h4>交通</h4><p>${esc(p.travel)}</p>${safetyHTML(p)}${p.budget?`<h4>租金參考</h4><p>${esc(p.budget)}</p>`:''}<a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">來源／查詢 ↗</a></article>`).join('')}</div>`:'<p>先點地點旁的 ☆，就能把住處或旅行目的地放在一起比較。</p>')}
function guide(){openModal('怎麼看這張圖',`<div class="intro-text"><p><b>先看綠色 Ealing Broadway 與 Reading：</b>前者重視倫敦生活，後者重視省租金和西部旅行。黃色是條件式居住候選，橘紅色是對妳需求較不優先的找房地點。</p><p><b>紫色是旅行／短住：</b>沒有把「不適合住半年」等同「不值得去」。Canterbury、Bath、Cambridge 與科茲窩都可收藏到旅行比較。</p><p><b>地鐵圖：</b>以妳提供 PDF 的第一頁為背景；數字對應左邊清單，區域定位在代表車站附近。第二頁是站名索引，沒有另加標記。圖外目的地點選後切到地理方位圖。</p><p><b>英國旅行方位：</b>用近似經緯度表示相對位置，沒有畫鐵路路線。科茲窩是區域，總標記僅作區域定位；Moreton、Bourton、Stow 等另有獨立標記。</p><p><b>治安與晚歸：</b>！標記是需要謹慎選房或留意街頭竊盜／晚歸的位置；可按「！需謹慎的位置」集中查看。點地點會顯示具體路段、選房建議及警方來源，收藏比較也保留備註。警方整治範圍不等於整區都危險，本圖不是即時犯罪熱點圖。原本「找房非優先」也可能只是租金、生活圈與交通取捨。標記使用代表車站；Muswell Hill 與 Blackheath 不在原地鐵圖內，點選後切到地理方位圖。</p><p><b>來源：</b>圖底保留 TfL 原始著作權與使用說明；此網站為私人個人規劃用途。原圖列印版本為 2026 年 9 月。房源價格是先前查詢刊登的參考，不是即時報價。每張地點卡有來源或官方交通連結。</p><p><b>創作者推薦：</b>「書中推薦」指《口袋裡的慢倫敦》可核實的目錄。Bath、Cambridge、Oxford、科茲窩等標為補充目的地，不冒稱已查到「兩個行李箱」推薦。</p></div>`)}
$('search').oninput=render;$('onlyFav').onchange=render;$('tubeTab').onclick=()=>setView('tube');$('geoTab').onclick=()=>setView('geo');$('offmap').onclick=()=>setView('geo');$('plus').onclick=()=>zoom(1.3);$('minus').onclick=()=>zoom(1/1.3);$('fit').onclick=fit;$('focusMap').onclick=()=>{const focused=document.body.classList.toggle('map-focus');$('focusMap').setAttribute('aria-pressed',focused);$('focusMap').textContent=focused?'返回對照':'專注地圖';fit()};$('labels').onclick=()=>{showLabels=!showLabels;$('labels').setAttribute('aria-pressed',showLabels);renderPins();applyTransform()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('viewport').requestFullscreen()}catch{flash('此瀏覽器不支援全螢幕，請使用放大按鈕。')}};$('guideBtn').onclick=guide;$('compareBtn').onclick=showComparison;function closeModal(){$('modal').hidden=true;modalLast?.focus()}$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDetail()};if(e.key==='Tab'&&!$('modal').hidden){const els=[...$('modal').querySelectorAll('button,a,input')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const vp=$('viewport');let drag=null;vp.addEventListener('wheel',e=>{if(e.target.closest('#details'))return;e.preventDefault();const r=vp.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0018),e.clientX-r.left,e.clientY-r.top)},{passive:false});vp.addEventListener('pointerdown',e=>{if(e.target.closest('button,#details'))return;drag={x:e.clientX,y:e.clientY,tx,ty};vp.setPointerCapture(e.pointerId);vp.classList.add('dragging')});vp.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyTransform()});function endDrag(){if(drag?.moved)lastDragTime=performance.now();drag=null;vp.classList.remove('dragging')}vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);vp.addEventListener('keydown',e=>{if(e.target!==vp)return;if(['+','=','-','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','0'].includes(e.key))e.preventDefault();if(e.key==='+'||e.key==='=')zoom(1.2);else if(e.key==='-')zoom(1/1.2);else if(e.key==='0')fit();else{if(e.key==='ArrowLeft')tx+=50;if(e.key==='ArrowRight')tx-=50;if(e.key==='ArrowUp')ty+=50;if(e.key==='ArrowDown')ty-=50;applyTransform()}});document.addEventListener('click',e=>{if(popupOpen&&performance.now()-lastDragTime>250&&!e.target.closest('.pin,.place-card,#details,#modal'))closeDetail()});let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fit,100)}).observe(vp);chips();setView('tube');
</script></body></html>
