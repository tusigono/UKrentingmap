function guide(){openModal('怎麼看這張圖',`<div class="intro-text"><p><b>先看綠色 Ealing Broadway 與 Reading：</b>前者重視倫敦生活，後者重視省租金和西部旅行。黃色是條件式居住候選，橘紅色是對妳需求較不優先的找房地點。</p><p><b>紫色是旅行／短住：</b>沒有把「不適合住半年」等同「不值得去」。Canterbury、Bath、Cambridge 與科茲窩都可收藏到旅行比較。</p><p><b>地鐵圖：</b>以妳提供 PDF 的第一頁為背景；數字對應左邊清單，區域定位在代表車站附近。第二頁是站名索引，沒有另加標記。圖外目的地點選後切到地理方位圖。</p><p><b>英國旅行方位：</b>用近似經緯度表示相對位置，沒有畫鐵路路線。科茲窩是區域，總標記僅作區域定位；Moreton、Bourton、Stow 等另有獨立標記。</p><p><b>治安：</b>本圖不是犯罪熱點圖，推薦不保證安全。「找房非優先」代表生活機能、旅程或預算取捨。未在目前可核實對話中明確判斷的街區，不補造「危險區」。</p><p><b>來源：</b>圖底保留 TfL 原始著作權與使用說明；此網站為私人個人規劃用途。原圖列印版本為 2026 年 9 月。房源價格是先前查詢刊登的參考，不是即時報價。每張地點卡有來源或官方交通連結。</p><p><b>創作者推薦：</b>「書中推薦」指《口袋裡的慢倫敦》可核實的目錄。Bath、Cambridge、Oxford、科茲窩等標為補充目的地，不冒稱已查到「兩個行李箱」推薦。</p></div>`)}
$('search').oninput=render;$('onlyFav').onchange=render;$('tubeTab').onclick=()=>setView('tube');$('geoTab').onclick=()=>setView('geo');$('offmap').onclick=()=>setView('geo');$('plus').onclick=()=>zoom(1.3);$('minus').onclick=()=>zoom(1/1.3);$('fit').onclick=fit;$('focusMap').onclick=()=>{const focused=document.body.classList.toggle('map-focus');$('focusMap').setAttribute('aria-pressed',focused);$('focusMap').textContent=focused?'返回對照':'專注地圖';fit()};$('labels').onclick=()=>{showLabels=!showLabels;$('labels').setAttribute('aria-pressed',showLabels);renderPins();applyTransform()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('viewport').requestFullscreen()}catch{flash('此瀏覽器不支援全螢幕，請使用放大按鈕。')}};$('guideBtn').onclick=guide;$('compareBtn').onclick=showComparison;function closeModal(){$('modal').hidden=true;modalLast?.focus()}$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!$('modal').hidden){const els=[...$('modal').querySelectorAll('button,a,input')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const vp=$('viewport');let drag=null;vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0018),e.clientX-r.left,e.clientY-r.top)},{passive:false});vp.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,tx,ty};vp.setPointerCapture(e.pointerId);vp.classList.add('dragging')});vp.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyTransform()});function endDrag(){drag=null;vp.classList.remove('dragging')}vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);vp.addEventListener('keydown',e=>{if(e.target!==vp)return;if(['+','=','-','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','0'].includes(e.key))e.preventDefault();if(e.key==='+'||e.key==='=')zoom(1.2);else if(e.key==='-')zoom(1/1.2);else if(e.key==='0')fit();else{if(e.key==='ArrowLeft')tx+=50;if(e.key==='ArrowRight')tx-=50;if(e.key==='ArrowUp')ty+=50;if(e.key==='ArrowDown')ty-=50;applyTransform()}});let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fit,100)}).observe(vp);chips();setView('tube');
</script></body></html>
